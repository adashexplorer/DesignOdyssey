name: Daily Interview Reading List

on:
  schedule:
    # 02:30 UTC = 08:00 IST (Bengaluru), every day. cron is always UTC.
    - cron: "30 2 * * *"
  workflow_dispatch: {}   # also lets you trigger a manual run from the Actions tab

permissions:
  contents: write         # needed to commit the daily brief back to the repo

defaults:
  run:
    working-directory: interview-curator   # all run-steps execute here

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run curator
        env:
          # Set PROVIDER / MODEL as repo "Variables" (Settings > Secrets and
          # variables > Actions > Variables). Defaults to anthropic.
          PROVIDER: ${{ vars.PROVIDER || 'anthropic' }}
          MODEL: ${{ vars.MODEL }}
          # Add whichever API key(s) you use as repo "Secrets".
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: python curator_agent.py

      - name: Commit today's brief
        run: |
          git config user.name "curator-bot"
          git config user.email "curator-bot@users.noreply.github.com"
          git add output/
          git commit -m "Daily brief $(date -u +%Y-%m-%d)" || echo "Nothing to commit"
          git push

      - name: Upload brief as artifact
        uses: actions/upload-artifact@v4
        with:
          # Not a run-step, so path is repo-root relative (working-directory
          # does not apply to actions, only to `run:` steps).
          name: daily-brief-${{ github.run_id }}
          path: interview-curator/output/*.md